services:
  ollama:
    image: ollama/ollama:latest
    container_name: incident-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    networks:
      - incident-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  api:
    build: .
    container_name: incident-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2:0.5b
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - incident-network

volumes:
  ollama_data:
    driver: local

networks:
  incident-network:
    driver: bridge
